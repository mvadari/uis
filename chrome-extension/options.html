<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Open in pr.html — Options</title>
        <style>
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
                margin: 2rem auto;
                max-width: 34rem;
                color: #1f2328;
            }
            h1 {
                font-size: 1.15rem;
                margin: 0 0 0.25rem;
            }
            p {
                color: #59636e;
                font-size: 0.875rem;
                margin: 0 0 1.25rem;
            }
            label {
                display: block;
                font-size: 0.8125rem;
                font-weight: 600;
                margin-bottom: 0.375rem;
            }
            input {
                width: 100%;
                padding: 0.5rem 0.625rem;
                font-size: 0.875rem;
                border: 1px solid #d1d9e0;
                border-radius: 6px;
                box-sizing: border-box;
            }
            button {
                margin-top: 0.875rem;
                padding: 0.4375rem 0.875rem;
                font-size: 0.875rem;
                font-weight: 500;
                color: #fff;
                background: #667eea;
                border: 0;
                border-radius: 6px;
                cursor: pointer;
            }
            #status {
                margin-left: 0.625rem;
                font-size: 0.8125rem;
                color: #1a7f37;
            }
            @media (prefers-color-scheme: dark) {
                body {
                    background: #0d1117;
                    color: #e6edf3;
                }
                input {
                    background: #0d1117;
                    color: #e6edf3;
                    border-color: #30363d;
                }
            }
        </style>
    </head>
    <body>
        <h1>Open in pr.html</h1>
        <p>
            Where to open pull requests. The extension appends
            <code>?pr=owner/repo/number</code> to this URL.
        </p>
        <label for="baseUrl">pr.html URL</label>
        <input id="baseUrl" type="url" placeholder="https://mvadari.github.io/uis/pr.html" />
        <div>
            <button id="save">Save</button>
            <span id="status"></span>
        </div>
        <script src="options.js"></script>
    </body>
</html>
