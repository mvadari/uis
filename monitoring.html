<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>XRPL Network Monitor</title>
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap"
        />
        <style>
            /* Palette taken from livenet.xrpl.org. */
            :root {
                --bg: #000;
                --surface: #111112;
                --surface-raised: #232325;
                --border: #343437;
                --border-strong: #454549;
                --fg: #fff;
                --fg-muted: #a2a2a4;
                --fg-subtle: #838386;
                --green: #32e685;
                --orange: #ff6719;
                --pink: #ff668b;
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            body {
                background: var(--bg);
                color: var(--fg-muted);
                font-family:
                    'Work Sans',
                    system-ui,
                    -apple-system,
                    'Segoe UI',
                    Roboto,
                    sans-serif;
                font-size: 12px;
                font-weight: 500;
                min-height: 100vh;
            }

            a {
                color: inherit;
                text-decoration: none;
            }

            a:hover {
                color: var(--fg);
            }

            .mono {
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            }

            .container {
                max-width: 1280px;
                margin: 0 auto;
                padding: 16px 24px 32px;
            }

            header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 12px;
                padding-bottom: 12px;
                border-bottom: 1px solid var(--border);
            }

            h1 {
                color: var(--fg);
                font-size: 20px;
                font-weight: 700;
            }

            h2 {
                color: var(--fg-muted);
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
            }

            .section-head {
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                gap: 8px 24px;
                margin-bottom: 10px;
            }

            .controls {
                display: flex;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
            }

            select,
            input[type='text'],
            button {
                background: var(--surface-raised);
                border: 1px solid var(--border);
                border-radius: 4px;
                color: var(--fg);
                font: inherit;
                font-size: 13px;
                padding: 6px 10px;
            }

            input[type='text'] {
                width: 320px;
            }

            button {
                cursor: pointer;
            }

            .node-group {
                display: flex;
                align-items: center;
                gap: 12px;
            }

            button:hover {
                border-color: var(--border-strong);
            }

            .conn {
                display: flex;
                align-items: center;
                gap: 8px;
                font-size: 12px;
                text-transform: uppercase;
                font-weight: 700;
            }

            .dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: var(--fg-subtle);
            }

            .conn.connected .dot {
                background: var(--green);
            }

            .conn.error .dot {
                background: var(--orange);
            }

            section {
                margin-top: 20px;
            }

            .stats {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                grid-auto-flow: dense;
                gap: 1px;
                padding: 1px;
            }

            .stat {
                padding: 12px 16px;
                outline: 1px solid var(--border);
            }

            .stat.wide {
                grid-column: span 2;
            }

            .stat-label {
                font-size: 10px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.04em;
            }

            .stat-value {
                color: var(--fg);
                font-size: 20px;
                font-weight: 600;
                margin-top: 4px;
            }

            .stat-unit {
                color: var(--fg-muted);
                font-size: 12px;
                font-weight: 500;
            }

            .stat-sub {
                margin-top: 2px;
                font-size: 11px;
                line-height: 1.4;
            }

            .ok {
                color: var(--green);
            }

            .warn {
                color: var(--orange);
            }

            /* Ledger stream, modeled on livenet.xrpl.org */
            .legend {
                display: flex;
                flex-wrap: wrap;
                gap: 16px;
                text-transform: uppercase;
                font-size: 10px;
                font-weight: 700;
            }

            .legend span {
                display: inline-flex;
                align-items: center;
                gap: 8px;
            }

            .swatch {
                display: inline-block;
                width: 14px;
                height: 4px;
                border-radius: 4px;
            }

            .ledger-list {
                display: flex;
                gap: 12px;
                overflow-x: auto;
                padding-bottom: 8px;
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }

            .ledger {
                width: 160px;
                flex-shrink: 0;
            }

            .ledger.new {
                animation: ledger-enter 0.4s;
            }

            @keyframes ledger-enter {
                from {
                    opacity: 0;
                    transform: translateX(-20px);
                }
            }

            .ledger-head {
                padding: 10px 12px;
                border: 1px solid var(--border);
                border-bottom: 0;
                font-size: 10px;
                font-weight: 700;
                line-height: 12px;
                text-align: center;
                text-transform: uppercase;
            }

            .ledger-index {
                color: var(--fg);
                font-size: 14px;
                line-height: 16px;
                padding-bottom: 3px;
            }

            .ledger-index.flag a {
                background: var(--border);
                border-radius: 2px;
                padding: 2px 4px;
            }

            .ledger-head .row {
                display: flex;
                justify-content: space-between;
                margin-top: 6px;
            }

            .ledger-head .row b {
                color: var(--fg);
                font-weight: 500;
            }

            .hash {
                padding: 0 12px 12px;
                border: 1px solid var(--border-strong);
                border-top: 0;
                background: rgba(35, 35, 37, 0.7);
                color: var(--fg);
            }

            .hash .bar {
                height: 2px;
                margin: 0 -12px;
                background: var(--green);
            }

            .hash.other .bar {
                background: var(--orange);
            }

            .hash.pending .bar {
                background: var(--fg-subtle);
            }

            .hash-title {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding-top: 10px;
                font-size: 13px;
                font-weight: 700;
            }

            .hash-title .check {
                color: var(--green);
            }

            .hash .subtitle {
                display: flex;
                flex-direction: column;
                padding: 8px 2px;
                color: var(--fg-muted);
                font-size: 10px;
                font-weight: 700;
                line-height: 14px;
                text-transform: uppercase;
            }

            .hash .subtitle span {
                display: flex;
                justify-content: space-between;
            }

            .hash .subtitle b {
                color: var(--fg);
                font-size: 11px;
            }

            .hash .subtitle .partial b {
                color: var(--pink);
            }

            .hash .subtitle .missed b {
                background: var(--orange);
                border-radius: 2px;
                padding: 0 3px;
            }

            /* Validator grid */
            .validator-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                gap: 1px;
                padding: 1px;
            }

            .vcell {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 7px 10px;
                outline: 1px solid var(--border);
                font-size: 12px;
            }

            .vcell .dot {
                flex-shrink: 0;
            }

            .vcell.ok .dot {
                background: var(--green);
            }

            .vcell.warn .dot {
                background: var(--orange);
            }

            .vname {
                flex: 1;
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                color: var(--fg);
            }

            .vstat,
            .vversion {
                flex-shrink: 0;
                font-size: 11px;
            }

            .vversion.newest {
                font-weight: 700;
            }

            #validatorsNote .vversion {
                margin-right: 8px;
                font-weight: 700;
            }

            /* The dot shows health; keep green free for the newest version. */
            .vcell.ok .vstat {
                color: var(--fg-muted);
            }

            .vcell.warn .vstat {
                color: var(--orange);
            }

            .badge {
                flex-shrink: 0;
                padding: 1px 6px;
                border-radius: 2px;
                font-size: 10px;
                font-weight: 700;
                text-transform: uppercase;
                background: var(--orange);
                color: var(--fg);
            }

            #tooltip {
                position: fixed;
                z-index: 10;
                max-width: min(480px, calc(100vw - 16px));
                padding: 8px 10px;
                overflow-wrap: anywhere;
                border: 1px solid var(--border-strong);
                border-radius: 4px;
                background: var(--surface-raised);
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6);
                color: var(--fg);
                font-size: 12px;
                line-height: 1.5;
                white-space: pre-line;
                pointer-events: none;
            }

            .empty {
                padding: 32px;
                text-align: center;
                border: 1px dashed var(--border);
            }

            .notice {
                margin-top: 12px;
                color: var(--orange);
            }

            @media (max-width: 720px) {
                .container {
                    padding: 12px;
                }

                /* Node field and Connect get their own full-width row, below network and status. */
                .controls {
                    width: 100%;
                }

                .node-group {
                    order: 1;
                    width: 100%;
                }

                input[type='text'] {
                    flex: 1;
                    min-width: 0;
                    width: auto;
                }

                /* Below 16px, iOS Safari zooms in on focus. */
                input[type='text'],
                select {
                    font-size: 16px;
                }
            }
        </style>
    </head>
    <body>
        <div class="container">
            <header>
                <h1>XRPL Network Monitor</h1>
                <div class="controls">
                    <label for="network" class="stat-label">Network</label>
                    <select id="network">
                        <option value="mainnet">Mainnet</option>
                        <option value="testnet">Testnet</option>
                        <option value="devnet">Devnet</option>
                        <option value="other">Other</option>
                    </select>
                    <div class="node-group">
                        <label for="nodeUrl" class="stat-label">Node</label>
                        <input type="text" id="nodeUrl" placeholder="wss://..." list="nodeList" />
                        <datalist id="nodeList"></datalist>
                        <button id="connectBtn">Connect</button>
                    </div>
                    <div class="conn" id="conn" role="status">
                        <span class="dot"></span><span id="connText">Disconnected</span>
                    </div>
                </div>
            </header>

            <section>
                <div class="stats" id="stats"></div>
            </section>

            <section>
                <div class="section-head">
                    <h2>Ledger validations</h2>
                    <div class="legend">
                        <span
                            ><i class="swatch" style="background: var(--green)"></i>Validated
                            hash</span
                        >
                        <span
                            ><i class="swatch" style="background: var(--orange)"></i>Different
                            hash</span
                        >
                    </div>
                </div>
                <div class="ledger-list" id="ledgers"></div>
            </section>

            <section>
                <div class="section-head">
                    <h2 id="validatorsTitle">UNL validators</h2>
                    <span id="validatorsNote"></span>
                </div>
                <div id="validators"></div>
            </section>
        </div>

        <div id="tooltip" role="tooltip" hidden></div>

        <script src="shared-utils.js"></script>
        <script>
            // Public nodes per network; the first is the default. Any node can be typed in.
            const NETWORKS = {
                mainnet: ['wss://s1.ripple.com', 'wss://s2.ripple.com', 'wss://xrplcluster.com'],
                testnet: [
                    'wss://s.altnet.rippletest.net:51233',
                    'wss://clio.altnet.rippletest.net:51233',
                    'wss://testnet.xrpl-labs.com',
                ],
                devnet: ['wss://s.devnet.rippletest.net:51233'],
            };
            const NETWORK_IDS = { 0: 'mainnet', 1: 'testnet', 2: 'devnet' };
            // The UNL publisher sites send no CORS headers, so UNL membership comes from the
            // data.xrpl.org registry, which records each validator's publisher. Keyed by network_id.
            const UNL_PUBLISHERS = {
                0: 'vl.ripple.com',
                1: 'vl.altnet.rippletest.net',
                2: 'vl.devnet.rippletest.net',
            };
            const EXPLORERS = {
                0: 'https://livenet.xrpl.org',
                1: 'https://testnet.xrpl.org',
                2: 'https://devnet.xrpl.org',
            };
            const REGISTRY_URL = 'https://data.xrpl.org/v1/network/validators';
            const NEGATIVE_UNL_INDEX =
                '2E8A59AA9D3B5B186B0B9E0F62E6C02587CA74A4D778938E957B6357D364B244';
            const FLAG_LEDGER_INTERVAL = 256;
            const LEDGERS_KEPT = 50;
            const LEDGERS_SHOWN = 12;
            const LAG_THRESHOLD = 3;
            const URL_KEY = 'monitoring_url';
            // Version colors, newest first. The newest is bright (and bold); older ones are muted
            // but still distinct hues. Orange is left out: it means a problem here.
            const VERSION_COLORS = [
                '#32e685',
                '#7a9cc6',
                '#a08cc0',
                '#b3a66e',
                '#7fadad',
                '#b88a99',
            ];
            const XRPL_ALPHABET = 'rpshnaf39wBUDNEGHJKLM4PQRST7VWXYZ2bcdeCg65jkm8oFqi1tuvAxyz';

            let ws = null;
            let reconnectTimer = null;
            let requestId = 0;
            const pending = new Map();

            let networkId = null;
            let reportedQuorum = 0;
            let registry = new Map(); // master key -> registry entry
            let signingToMaster = new Map();
            let unl = new Set(); // master keys
            let registryError = null;
            let nunl = null; // { exists, ledgerIndex, disabled, toDisable, toReEnable, error }
            let ledgers = new Map(); // index -> { index, hash, closeTime, txnCount, validations }
            let lastValidated = null;
            let firstValidated = null;
            let lastSeen = new Map(); // validator key -> last ledger index it validated
            let versions = new Map(); // validator key -> { version, ledger } from its validations
            let renderTimer = null;
            let renderedLedgers = new Set(); // animate a ledger card only on first render

            // ---------- Key encoding ----------

            // Converts a hex node public key (as stored in NegativeUNL) to the base58 "n..." form
            // that the validations stream and registry use.
            async function nodePublicKey(hex) {
                const payload = new Uint8Array([
                    0x1c,
                    ...hex.match(/../g).map((h) => parseInt(h, 16)),
                ]);
                const h1 = await crypto.subtle.digest('SHA-256', payload);
                const h2 = new Uint8Array(await crypto.subtle.digest('SHA-256', h1));
                const bytes = [...payload, ...h2.slice(0, 4)];
                let n = BigInt('0x' + bytes.map((b) => b.toString(16).padStart(2, '0')).join(''));
                let out = '';
                while (n > 0n) {
                    out = XRPL_ALPHABET[Number(n % 58n)] + out;
                    n /= 58n;
                }
                for (const b of bytes) {
                    if (b !== 0) break;
                    out = XRPL_ALPHABET[0] + out;
                }
                return out;
            }

            // ---------- Connection ----------

            function request(command) {
                return new Promise((resolve) => {
                    const id = ++requestId;
                    pending.set(id, resolve);
                    ws.send(JSON.stringify({ ...command, id }));
                });
            }

            function setConn(state, text) {
                document.getElementById('conn').className = `conn ${state}`;
                document.getElementById('connText').textContent = text;
            }

            function resetState() {
                networkId = null;
                reportedQuorum = 0;
                unl = new Set();
                nunl = null;
                ledgers = new Map();
                lastValidated = null;
                firstValidated = null;
                lastSeen = new Map();
                versions = new Map();
                renderedLedgers = new Set();
                pending.clear();
            }

            function connect(url) {
                clearTimeout(reconnectTimer);
                if (ws) {
                    ws.onopen = ws.onmessage = ws.onclose = null;
                    ws.close();
                }
                resetState();
                render();
                Storage.set(URL_KEY, url);
                setConn('', `Connecting to ${url}`);

                let socket;
                try {
                    socket = new WebSocket(url);
                } catch (e) {
                    setConn('error', `Invalid URL: ${url}`);
                    return;
                }
                ws = socket;
                socket.onopen = () => onOpen(url);
                socket.onmessage = (e) => onMessage(JSON.parse(e.data));
                socket.onclose = () => {
                    setConn('error', 'Disconnected, retrying…');
                    reconnectTimer = setTimeout(() => connect(url), 3000);
                };
            }

            async function onOpen(url) {
                setConn('connected', url.replace(/^wss?:\/\//, ''));
                const info = await request({ command: 'server_info' });
                networkId = info.result?.info?.network_id ?? 0;
                reportedQuorum = info.result?.info?.validation_quorum || 0;
                syncNetworkSelect();
                applyUnl();
                await request({ command: 'subscribe', streams: ['ledger', 'validations'] });
                refreshNegativeUnl();
                render();
            }

            function onMessage(msg) {
                if (msg.type === 'response') {
                    const resolve = pending.get(msg.id);
                    pending.delete(msg.id);
                    if (resolve) resolve(msg);
                    return;
                }
                if (msg.type === 'ledgerClosed') onLedger(msg);
                else if (msg.type === 'validationReceived') onValidation(msg);
            }

            function getLedger(index) {
                let ledger = ledgers.get(index);
                if (!ledger) {
                    ledger = { index, hash: null, closeTime: null, txnCount: null };
                    ledger.validations = new Map();
                    ledgers.set(index, ledger);
                    const oldest = [...ledgers.keys()].sort((a, b) => a - b);
                    while (oldest.length > LEDGERS_KEPT) {
                        const index = oldest.shift();
                        ledgers.delete(index);
                        renderedLedgers.delete(index);
                    }
                }
                return ledger;
            }

            // The ledger stream only reports validated ledgers.
            function onLedger(msg) {
                const ledger = getLedger(msg.ledger_index);
                ledger.hash = msg.ledger_hash;
                ledger.closeTime = msg.ledger_time;
                ledger.txnCount = msg.txn_count ?? null;
                lastValidated = Math.max(lastValidated ?? 0, msg.ledger_index);
                firstValidated ??= msg.ledger_index;
                // The NegativeUNL object only changes on flag ledgers, but a lookup per ledger is
                // cheap and avoids missing a change across a reconnect.
                refreshNegativeUnl();
                scheduleRender();
            }

            function validatorKey(msg) {
                return (
                    msg.master_key ||
                    signingToMaster.get(msg.validation_public_key) ||
                    msg.validation_public_key
                );
            }

            function onValidation(msg) {
                const index = Number(msg.ledger_index);
                // Ignore stragglers for ledgers already pruned.
                if (lastValidated && index < lastValidated - LEDGERS_KEPT) return;
                const key = validatorKey(msg);
                getLedger(index).validations.set(key, {
                    hash: msg.ledger_hash,
                    full: msg.full !== false,
                });
                lastSeen.set(key, Math.max(lastSeen.get(key) ?? 0, index));
                // Validators only include ServerVersion on voting ledgers (one per 256).
                const version = msg.server_version && decodeServerVersion(msg.server_version);
                if (version) versions.set(key, { version, ledger: index });
                scheduleRender();
            }

            // ---------- Data sources ----------

            async function loadRegistry() {
                try {
                    const res = await fetch(REGISTRY_URL);
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    const data = await res.json();
                    registry = new Map();
                    signingToMaster = new Map();
                    for (const v of data.validators || []) {
                        const master = v.master_key || v.validation_public_key;
                        registry.set(master, v);
                        if (v.signing_key) signingToMaster.set(v.signing_key, master);
                    }
                    registryError = null;
                } catch (e) {
                    registryError = `Could not load the validator registry (${e.message}). UNL membership is unknown.`;
                }
                applyUnl();
                render();
            }

            function applyUnl() {
                const publisher = UNL_PUBLISHERS[networkId];
                unl = new Set();
                if (!publisher) return;
                for (const [master, v] of registry) if (v.unl === publisher) unl.add(master);
            }

            let nunlInFlight = false;
            async function refreshNegativeUnl() {
                if (nunlInFlight || !ws || ws.readyState !== WebSocket.OPEN) return;
                nunlInFlight = true;
                try {
                    const res = await request({
                        command: 'ledger_entry',
                        index: NEGATIVE_UNL_INDEX,
                        ledger_index: 'validated',
                    });
                    // rippled deletes the NegativeUNL object when it becomes empty.
                    if (res.error === 'entryNotFound') {
                        // Clio omits ledger_index on errors.
                        const ledgerIndex = res.ledger_index ?? lastValidated;
                        nunl = { exists: false, ledgerIndex, disabled: [] };
                    } else if (res.error) {
                        nunl = { error: res.error_message || res.error };
                    } else {
                        const node = res.result.node;
                        const disabled = await Promise.all(
                            (node.DisabledValidators || []).map(async ({ DisabledValidator }) => ({
                                key: await nodePublicKey(DisabledValidator.PublicKey),
                                since: DisabledValidator.FirstLedgerSequence,
                            })),
                        );
                        nunl = {
                            exists: true,
                            ledgerIndex: res.result.ledger_index,
                            disabled,
                            toDisable:
                                node.ValidatorToDisable &&
                                (await nodePublicKey(node.ValidatorToDisable)),
                            toReEnable:
                                node.ValidatorToReEnable &&
                                (await nodePublicKey(node.ValidatorToReEnable)),
                        };
                    }
                } finally {
                    nunlInFlight = false;
                }
                scheduleRender();
            }

            // ---------- Derived values ----------

            function nunlKeys() {
                return new Set((nunl?.disabled || []).map((d) => d.key));
            }

            // Quorum as rippled computes it: 80% of the UNL minus the nUNL, but never below 60% of
            // the full UNL. Used only when the server does not report its own quorum.
            function quorum() {
                if (reportedQuorum) return reportedQuorum;
                if (!unl.size) return null;
                const effective = unl.size - nunlKeys().size;
                return Math.max(Math.ceil(effective * 0.8), Math.ceil(unl.size * 0.6));
            }

            function nextFlagLedger() {
                if (!lastValidated) return null;
                return Math.ceil((lastValidated + 1) / FLAG_LEDGER_INTERVAL) * FLAG_LEDGER_INTERVAL;
            }

            function avgCloseInterval() {
                const times = [...ledgers.values()]
                    .filter((l) => l.closeTime != null)
                    .sort((a, b) => a.index - b.index)
                    .slice(-11);
                if (times.length < 2) return null;
                const first = times[0];
                const last = times[times.length - 1];
                return (last.closeTime - first.closeTime) / (last.index - first.index);
            }

            // Ledgers old enough that late validations have arrived. The first validated ledger is
            // skipped: most of its validations arrived before the subscription started.
            function settledLedgers() {
                return [...ledgers.values()].filter(
                    (l) => l.hash && l.index > firstValidated && l.index < lastValidated,
                );
            }

            // Classifies each UNL validator from the ledgers seen since connecting.
            function unlHealth() {
                const nunlSet = nunlKeys();
                const settled = settledLedgers().sort((a, b) => a.index - b.index);
                const recent = settled.slice(-5);
                const warmingUp =
                    lastValidated == null || lastValidated - firstValidated <= LAG_THRESHOLD;
                const rows = [...unl].map((key) => {
                    const seen = lastSeen.get(key);
                    const agreed = settled.filter(
                        (l) => l.validations.get(key)?.hash === l.hash,
                    ).length;
                    let state = 'ok';
                    let label = 'Validating';
                    if (seen == null) {
                        [state, label] = warmingUp ? ['waiting', 'Waiting'] : ['idle', 'Not seen'];
                    } else if (lastValidated - seen > LAG_THRESHOLD) {
                        [state, label] = ['idle', `${lastValidated - seen} behind`];
                    } else if (
                        recent.some(
                            (l) => l.validations.has(key) && l.validations.get(key).hash !== l.hash,
                        )
                    ) {
                        [state, label] = ['disagreeing', 'Different hash'];
                    }
                    return {
                        key,
                        state,
                        label,
                        cls: { ok: 'ok', waiting: '' }[state] ?? 'warn',
                        agreed,
                        settled: settled.length,
                        onNunl: nunlSet.has(key),
                        entry: registry.get(key),
                    };
                });
                const rank = { idle: 0, disagreeing: 1, waiting: 2, ok: 3 };
                return rows.sort(
                    (a, b) =>
                        b.onNunl - a.onNunl ||
                        rank[a.state] - rank[b.state] ||
                        (a.entry?.domain || '~').localeCompare(b.entry?.domain || '~'),
                );
            }

            function trustedCount(ledger, hash) {
                let n = 0;
                for (const [key, v] of ledger.validations)
                    if (unl.has(key) && (!hash || v.hash === hash)) n++;
                return n;
            }

            function validatorName(key) {
                return registry.get(key)?.domain || null;
            }

            function short(key) {
                return `${key.slice(0, 8)}…${key.slice(-6)}`;
            }

            function explorerLedger(index) {
                const base = EXPLORERS[networkId];
                return base ? `${base}/ledgers/${index}` : null;
            }

            // Decodes rippled's 64-bit ServerVersion (BuildInfo::encodeSoftwareVersion): a 0x183B
            // implementation ID, then major, minor, patch, and a pre-release byte (0x40 | n for
            // -bN, 0x80 | n for -rcN, 0xC0 for a release). Returns null for other implementations.
            function decodeServerVersion(value) {
                const v = BigInt(value);
                if (v >> 48n !== 0x183bn) return null;
                const byte = (shift) => Number((v >> BigInt(shift)) & 0xffn);
                const pre = byte(16);
                const n = pre & 0x3f;
                const suffix = { 0x40: `-b${n}`, 0x80: `-rc${n}` }[pre & 0xc0] ?? '';
                return `${byte(40)}.${byte(32)}.${byte(24)}${suffix}`;
            }

            // Newest version first; a release sorts above its release candidates and betas.
            function compareVersions(a, b) {
                const parse = (v) => {
                    const m = /^(\d+)\.(\d+)\.(\d+)(?:-(b|rc)(\d+))?/.exec(v) || [];
                    const type = { b: 0, rc: 1 }[m[4]] ?? 2;
                    return [+m[1] || 0, +m[2] || 0, +m[3] || 0, type, +m[5] || 0];
                };
                const pa = parse(a);
                const pb = parse(b);
                for (let i = 0; i < pa.length; i++) if (pa[i] !== pb[i]) return pb[i] - pa[i];
                return 0;
            }

            // A validation's version beats the registry's, which may be stale.
            function versionOf(key) {
                const live = versions.get(key);
                if (live)
                    return {
                        version: live.version,
                        source: `from validation of ledger ${live.ledger.toLocaleString()}`,
                    };
                const registered = registry.get(key)?.server_version;
                return registered ? { version: registered, source: 'from data.xrpl.org' } : null;
            }

            // ---------- Rendering ----------

            function scheduleRender() {
                if (renderTimer) return;
                renderTimer = setTimeout(() => {
                    renderTimer = null;
                    render();
                }, 250);
            }

            function render() {
                const health = unlHealth();
                renderStats(health);
                renderLedgers();
                renderValidators(health);
                updateTooltip();
            }

            function stat(label, value, sub = '', cls = '', extra = '') {
                return `<div class="stat ${extra}">
                    <div class="stat-label">${label}</div>
                    <div class="stat-value ${cls}">${value ?? '—'}</div>
                    <div class="stat-sub">${sub}</div>
                </div>`;
            }

            function nameList(rows, withLabel) {
                return rows
                    .map(
                        (r) =>
                            `<span data-tip="${escapeHtml(r.key)}">${escapeHtml(validatorName(r.key) || short(r.key))}</span>` +
                            (withLabel ? ` (${escapeHtml(r.label.toLowerCase())})` : ''),
                    )
                    .join(', ');
            }

            function nunlStat() {
                if (!nunl) return stat('Negative UNL', null, '', '', 'wide');
                if (nunl.error)
                    return stat('Negative UNL', 'Unknown', escapeHtml(nunl.error), 'warn', 'wide');
                const label = (key) => nameList([{ key }]);
                const lines = nunl.disabled.map(
                    (d) => `${label(d.key)} (since ${d.since.toLocaleString()})`,
                );
                if (nunl.toDisable) lines.push(`Disabling at next flag: ${label(nunl.toDisable)}`);
                if (nunl.toReEnable)
                    lines.push(`Re-enabling at next flag: ${label(nunl.toReEnable)}`);
                if (!nunl.exists) lines.push('No NegativeUNL object');
                const count = nunl.disabled.length;
                const max = unl.size ? ` / max ${Math.floor(unl.size * 0.25)}` : '';
                return stat(
                    'Negative UNL',
                    `${count}<span class="stat-unit">${max}</span>`,
                    lines.join('<br>'),
                    count ? 'warn' : 'ok',
                    'wide',
                );
            }

            function renderStats(health) {
                const q = quorum();
                const interval = avgCloseInterval();
                const latest = lastValidated ? ledgers.get(lastValidated) : null;
                const trusted = latest ? trustedCount(latest, latest.hash) : null;
                const others = latest
                    ? [...latest.validations.keys()].filter((k) => !unl.has(k)).length
                    : null;
                const flag = nextFlagLedger();

                const idle = health.filter((r) => r.state === 'idle');
                const disagreeing = health.filter((r) => r.state === 'disagreeing');
                let unlSub = others != null ? `${others} other validators` : '';
                if (health.length && health.every((r) => r.state === 'waiting')) {
                    unlSub += '<br>Checking which validators are active…';
                } else if (health.length) {
                    unlSub += idle.length
                        ? `<br><span class="warn">Not validating: ${nameList(idle, true)}</span>`
                        : '<br><span class="ok">All UNL validators are validating</span>';
                    if (disagreeing.length)
                        unlSub += `<br><span class="warn">Different hash: ${nameList(disagreeing)}</span>`;
                }

                document.getElementById('stats').innerHTML = [
                    stat(
                        'Validated ledger',
                        lastValidated?.toLocaleString(),
                        networkId != null ? `Network ID ${networkId}` : '',
                    ),
                    stat(
                        'Avg close interval',
                        interval != null ? `${interval.toFixed(2)}s` : null,
                        'Last 10 ledgers',
                    ),
                    stat(
                        'UNL validations',
                        trusted != null && unl.size ? `${trusted} / ${unl.size}` : null,
                        unlSub,
                        trusted != null && q ? (trusted >= q ? 'ok' : 'warn') : '',
                        'wide',
                    ),
                    stat('Quorum', q, reportedQuorum ? 'Reported by server' : 'Computed from UNL'),
                    nunlStat(),
                    stat(
                        'Next flag ledger',
                        flag?.toLocaleString(),
                        flag ? `in ${flag - lastValidated} ledgers` : '',
                    ),
                ].join('');
            }

            function names(keys) {
                return keys
                    .map((k) => validatorName(k) || short(k))
                    .sort()
                    .join('\n');
            }

            function renderHash(ledger, hash, validations) {
                const isValidated = ledger.hash && hash === ledger.hash;
                const cls = !ledger.hash ? 'pending' : isValidated ? '' : 'other';
                const trusted = validations.filter((v) => unl.has(v.key));
                const others = validations.length - trusted.length;
                const partial = validations.filter((v) => !v.full);

                let unlRow = '';
                if (unl.size) {
                    const tip = trusted.length
                        ? `UNL validators:\n${names(trusted.map((v) => v.key))}`
                        : '';
                    unlRow = `<span data-tip="${escapeHtml(tip)}">UNL <b>${trusted.length}/${unl.size}</b></span>`;
                }
                let partialRow = '';
                if (partial.length) {
                    const tip = `Partial validations:\n${names(partial.map((v) => v.key))}`;
                    partialRow = `<span class="partial" data-tip="${escapeHtml(tip)}">Partial <b>${partial.length}</b></span>`;
                }
                let missedRow = '';
                if (isValidated && unl.size && ledger.index > firstValidated) {
                    const missing = [...unl].filter((k) => !ledger.validations.has(k));
                    if (missing.length) {
                        const tip = `Missed by:\n${names(missing)}`;
                        missedRow = `<span class="missed" data-tip="${escapeHtml(tip)}">Missed <b>${missing.length}</b></span>`;
                    }
                }

                return `<div class="hash ${cls}">
                    <div class="bar"></div>
                    <div class="hash-title">
                        <span class="mono" data-tip="${escapeHtml(hash)}">${escapeHtml(hash.slice(0, 6))}</span>
                        ${isValidated ? '<span class="check" aria-label="validated">✓</span>' : ''}
                    </div>
                    <div class="subtitle">
                        ${unlRow}
                        <span>Other <b>${others}</b></span>
                        ${partialRow}
                        ${missedRow}
                    </div>
                </div>`;
            }

            function renderLedgers() {
                const el = document.getElementById('ledgers');
                const list = [...ledgers.values()]
                    .sort((a, b) => b.index - a.index)
                    .slice(0, LEDGERS_SHOWN);
                if (!list.length) {
                    el.innerHTML = '<div class="empty">Waiting for ledgers…</div>';
                    return;
                }
                el.innerHTML = list
                    .map((ledger) => {
                        const byHash = new Map();
                        for (const [key, v] of ledger.validations) {
                            if (!byHash.has(v.hash)) byHash.set(v.hash, []);
                            byHash.get(v.hash).push({ key, full: v.full });
                        }
                        if (ledger.hash && !byHash.has(ledger.hash)) byHash.set(ledger.hash, []);
                        const hashes = [...byHash.entries()].sort(
                            ([ha, a], [hb, b]) =>
                                (hb === ledger.hash) - (ha === ledger.hash) || b.length - a.length,
                        );
                        const link = explorerLedger(ledger.index);
                        const indexText = ledger.index.toLocaleString();
                        const isFlag = ledger.index % FLAG_LEDGER_INTERVAL === 0;
                        const closeTime =
                            ledger.closeTime != null
                                ? new Date(
                                      (ledger.closeTime + 946684800) * 1000,
                                  ).toLocaleTimeString()
                                : 'Not validated yet';
                        const isNew = !renderedLedgers.has(ledger.index);
                        renderedLedgers.add(ledger.index);
                        return `<div class="ledger ${isNew ? 'new' : ''}">
                            <div class="ledger-head">
                                <div class="ledger-index ${isFlag ? 'flag' : ''}">${
                                    link
                                        ? `<a href="${link}" target="_blank" rel="noopener">${indexText}</a>`
                                        : indexText
                                }</div>
                                <div>${closeTime}${isFlag ? ' · flag' : ''}</div>
                                <div class="row"><span>Txns</span><b>${ledger.txnCount ?? '—'}</b></div>
                            </div>
                            ${hashes.map(([hash, vals]) => renderHash(ledger, hash, vals)).join('')}
                        </div>`;
                    })
                    .join('');
            }

            function renderValidators(health) {
                const el = document.getElementById('validators');
                const title = document.getElementById('validatorsTitle');
                const note = document.getElementById('validatorsNote');
                if (!unl.size) {
                    const why =
                        registryError ||
                        (networkId != null && !UNL_PUBLISHERS[networkId]
                            ? `No known UNL publisher for network ID ${networkId}.`
                            : 'Loading the UNL…');
                    title.textContent = 'UNL validators';
                    note.textContent = '';
                    el.innerHTML = `<div class="empty">${escapeHtml(why)}</div>`;
                    return;
                }
                const settledCount = health[0]?.settled ?? 0;
                const counts = new Map();
                for (const r of health) {
                    r.version = versionOf(r.key);
                    const v = r.version?.version;
                    if (v) counts.set(v, (counts.get(v) || 0) + 1);
                }
                const colors = new Map(
                    [...counts.keys()]
                        .sort(compareVersions)
                        .map((v, i) => [v, VERSION_COLORS[i] || 'var(--fg-subtle)']),
                );
                const newest = colors.keys().next().value;
                const versionTag = (v, text) =>
                    `<span class="vversion ${v === newest ? 'newest' : ''}" style="color: ${colors.get(v)}">${escapeHtml(text)}</span>`;

                title.textContent = `UNL validators (${unl.size}, from ${UNL_PUBLISHERS[networkId]})`;
                note.innerHTML = `${[...colors.keys()]
                    .map((v) => versionTag(v, `${v} ×${counts.get(v)}`))
                    .join(' ')} · Agreement over the last ${settledCount} ledgers`;
                el.innerHTML = `<div class="validator-grid">${health
                    .map((r) => {
                        const name = r.entry?.domain || 'Unknown domain';
                        const tip = [
                            name,
                            r.key,
                            `Status: ${r.label}${r.onNunl ? ' (on the Negative UNL)' : ''}`,
                            `Last ledger: ${lastSeen.get(r.key)?.toLocaleString() ?? '—'}`,
                            `Agreement: ${r.agreed}/${r.settled} ledgers`,
                            r.version
                                ? `Version: ${r.version.version} (${r.version.source})`
                                : 'Version: unknown',
                        ].join('\n');
                        const value = r.cls === 'ok' ? `${r.agreed}/${r.settled}` : r.label;
                        return `<div class="vcell ${r.cls}" data-tip="${escapeHtml(tip)}">
                            <span class="dot"></span>
                            <span class="vname">${escapeHtml(name)}</span>
                            ${r.onNunl ? '<span class="badge">nUNL</span>' : ''}
                            ${r.version ? versionTag(r.version.version, r.version.version) : ''}
                            <span class="vstat">${escapeHtml(value)}</span>
                        </div>`;
                    })
                    .join(
                        '',
                    )}</div>${registryError ? `<div class="notice">${escapeHtml(registryError)}</div>` : ''}`;
            }

            // ---------- Tooltip ----------

            // Sections re-render several times a second, which replaces the hovered element before a
            // native title tooltip can appear. One tooltip follows the pointer instead. On touch
            // screens a tap shows it, and a tap elsewhere or a scroll hides it.
            const tooltip = document.getElementById('tooltip');
            let pointer = null;
            let fromTouch = false;

            function updateTooltip() {
                const target =
                    pointer &&
                    document.elementFromPoint(pointer.x, pointer.y)?.closest('[data-tip]');
                if (!target || !target.dataset.tip) {
                    tooltip.hidden = true;
                    return;
                }
                tooltip.textContent = target.dataset.tip;
                tooltip.hidden = false;
                const { width, height } = tooltip.getBoundingClientRect();
                let x = pointer.x + 12;
                let y = pointer.y + 16;
                if (x + width > window.innerWidth - 8) x = pointer.x - width - 12;
                if (y + height > window.innerHeight - 8) y = pointer.y - height - 12;
                tooltip.style.left = `${Math.max(8, x)}px`;
                tooltip.style.top = `${Math.max(8, y)}px`;
            }

            document.addEventListener('mousemove', (e) => {
                if (fromTouch) return; // browsers emulate a mousemove after a tap
                pointer = { x: e.clientX, y: e.clientY };
                updateTooltip();
            });
            document.addEventListener('pointerdown', (e) => {
                fromTouch = e.pointerType !== 'mouse';
                if (!fromTouch) return;
                pointer = { x: e.clientX, y: e.clientY };
                updateTooltip();
            });
            document.documentElement.addEventListener('mouseleave', () => {
                pointer = null;
                updateTooltip();
            });
            window.addEventListener(
                'scroll',
                () => {
                    if (fromTouch) pointer = null;
                    updateTooltip();
                },
                true,
            );

            // ---------- Setup ----------

            const networkSelect = document.getElementById('network');
            const nodeUrl = document.getElementById('nodeUrl');

            function setNodeSuggestions(network) {
                document.getElementById('nodeList').innerHTML = (NETWORKS[network] || [])
                    .map((url) => `<option value="${escapeHtml(url)}"></option>`)
                    .join('');
            }

            function connectNode(url) {
                if (!url) return;
                nodeUrl.value = url;
                setQueryParam('node', url);
                connect(url);
            }

            networkSelect.addEventListener('change', () => {
                const network = networkSelect.value;
                setNodeSuggestions(network);
                if (NETWORKS[network]) {
                    connectNode(NETWORKS[network][0]);
                } else {
                    nodeUrl.value = '';
                    nodeUrl.focus();
                }
            });
            document
                .getElementById('connectBtn')
                .addEventListener('click', () => connectNode(nodeUrl.value.trim()));
            nodeUrl.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') connectNode(nodeUrl.value.trim());
            });

            // Shows the network the node actually reports, not the one picked from the menu.
            function syncNetworkSelect() {
                const network = NETWORK_IDS[networkId] || 'other';
                networkSelect.value = network;
                setNodeSuggestions(network);
            }

            function initialUrl() {
                const network = getQueryParam('network');
                return (
                    getQueryParam('node') ||
                    NETWORKS[network]?.[0] ||
                    Storage.get(URL_KEY) ||
                    NETWORKS.mainnet[0]
                );
            }

            const startUrl = initialUrl();
            const startNetwork =
                Object.keys(NETWORKS).find((k) => NETWORKS[k].includes(startUrl)) || 'other';
            networkSelect.value = startNetwork;
            setNodeSuggestions(startNetwork);
            nodeUrl.value = startUrl;

            loadRegistry();
            connect(startUrl);
        </script>
    </body>
</html>
